    <script>
      (function () {
        // Safe mock response for blocked telemetry calls
        function createMockResponse() {
          return new Response(JSON.stringify({ status: "ok" }), {
            status: 200,
            headers: { "Content-Type": "application/json" },
          });
        }

        // 1. Intercept window.fetch to silently handle google-analytics and blocked telemetry
        if (typeof window !== "undefined" && window.fetch) {
          var originalFetch = window.fetch;
          window.fetch = function (resource, init) {
            try {
              var url = "";
              if (typeof resource === "string") {
                url = resource;
              } else if (resource && resource.url) {
                url = resource.url;
              }

              if (url && (url.indexOf("google-analytics.com") !== -1 || url.indexOf("googletagmanager.com") !== -1 || url.indexOf("/collect") !== -1)) {
                return Promise.resolve(createMockResponse());
              }

              return originalFetch.apply(this, arguments).catch(function (err) {
                if (url && (url.indexOf("analytics") !== -1 || url.indexOf("telemetry") !== -1 || (err && err.message && err.message.indexOf("Failed to fetch") !== -1))) {
                  return createMockResponse();
                }
                return Promise.reject(err);
              });
            } catch (e) {
              return Promise.resolve(createMockResponse());
            }
          };
        }

        // 2. Intercept XMLHttpRequest to prevent blocked XHR errors
        if (typeof window !== "undefined" && window.XMLHttpRequest) {
          var OriginalXHR = window.XMLHttpRequest;
          var originalOpen = OriginalXHR.prototype.open;
          var originalSend = OriginalXHR.prototype.send;

          OriginalXHR.prototype.open = function (method, url) {
            this._url = url || "";
            return originalOpen.apply(this, arguments);
          };

          OriginalXHR.prototype.send = function () {
            if (this._url && (this._url.indexOf("google-analytics.com") !== -1 || this._url.indexOf("googletagmanager.com") !== -1)) {
              // Silently simulate success
              Object.defineProperty(this, "readyState", { value: 4, writable: true });
              Object.defineProperty(this, "status", { value: 200, writable: true });
              Object.defineProperty(this, "responseText", { value: "{}", writable: true });
              if (typeof this.onload === "function") {
                try { this.onload(); } catch (e) {}
              }
              return;
            }
            return originalSend.apply(this, arguments);
          };
        }

        // 3. Stub global analytics objects
        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function () {};
        window.ga = window.ga || function () {};

        // 4. Suppress unhandled rejection errors from extension scripts
        window.addEventListener("unhandledrejection", function (event) {
          if (event && event.reason) {
            var reasonStr = String(event.reason.message || event.reason || "");
            if (reasonStr.indexOf("google-analytics") !== -1 || reasonStr.indexOf("ERR_BLOCKED_BY_CLIENT") !== -1) {
              event.preventDefault();
            }
          }
        });
      })();
    </script>
    <title>ThreatLens - Security Dashboard</title>

  </body>
